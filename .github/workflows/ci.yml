# =============================================================================
# Pipeline CI/CD — Sistema de Reservas de Salas de Biblioteca
# Ejecuta lint, pruebas y build de Docker en cada Push/PR hacia main
# =============================================================================

name: CI Pipeline

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]

# Cancelar ejecuciones anteriores del mismo branch para ahorrar minutos
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: Lint
  # Verifica que el código siga los estándares ESLint del equipo
  # ────────────────────────────────────────────────────────────────────────────
  lint:
    name: 🔍 Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar ESLint
        run: npm run lint

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: Pruebas con cobertura
  # Ejecuta todas las pruebas Jest y publica el reporte de cobertura
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: 🧪 Pruebas
    runs-on: ubuntu-latest
    needs: lint

    env:
      NODE_ENV: test
      DB_PATH: ':memory:'
      JWT_SECRET: secreto_ci_pipeline

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas con cobertura
        run: npm run test:coverage

      - name: Publicar reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-cobertura
          path: coverage/
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # Job 3: Build de Docker
  # Verifica que la imagen Docker se construya correctamente
  # Solo en PRs y push a main
  # ────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker (sin push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: reservas-biblioteca:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────────────────────
  # Job 4: Deploy a Railway (solo en push a main)
  # Despliega automáticamente al entorno de staging/producción
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy a Railway
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy a Railway
        run: railway up --service reservas-biblioteca
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Notificar deploy exitoso
        run: |
          echo "✅ Deploy completado exitosamente"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
