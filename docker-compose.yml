# =============================================================================
# docker-compose.yml — Sistema de Reservas de Salas de Biblioteca
# Levanta la API y un volumen persistente para la base de datos SQLite
# =============================================================================

version: '3.9'

services:

  # ── API REST ────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: reservas-biblioteca-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DB_PATH: /app/data/biblioteca.db
      JWT_SECRET: ${JWT_SECRET:?La variable JWT_SECRET es obligatoria}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
    volumes:
      # Persistencia de la base de datos SQLite fuera del contenedor
      - db_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - biblioteca_net

  # ── Entorno de desarrollo (con nodemon y hot-reload) ────────────────────────
  api-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: reservas-biblioteca-dev
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_PATH: /app/data/biblioteca_dev.db
      JWT_SECRET: secreto_dev_no_usar_en_produccion
      JWT_EXPIRATION: 24h
    volumes:
      - ./src:/app/src
      - ./database:/app/database
      - ./docs:/app/docs
      - db_dev_data:/app/data
    networks:
      - biblioteca_net
    profiles:
      # Solo se levanta con: docker-compose --profile dev up
      - dev

# ── Volúmenes persistentes ──────────────────────────────────────────────────
volumes:
  db_data:
    driver: local
  db_dev_data:
    driver: local

# ── Red interna ─────────────────────────────────────────────────────────────
networks:
  biblioteca_net:
    driver: bridge
